name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag to validate against metadata.yaml
        required: false
        type: string

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.13.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"

      - name: Install build and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          setuptools==80.9.0 wheel==0.45.1 ruff==0.12.0

      - name: Install plugin runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build Linux SDK wheel for diagnostics
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: >-
          python -m pip wheel --no-index --no-deps --no-build-isolation
          --no-cache-dir --wheel-dir dist .

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Upload Linux SDK wheel diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build-diagnostics-${{ github.run_id }}
          path: dist/*.whl
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.13.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"

      - name: Install build and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          setuptools==80.9.0 wheel==0.45.1 ruff==0.12.0

      - name: Install plugin runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Windows host and packaging tests
        run: >-
          python -m unittest -v
          tests.host.test_b05_sdk_bootstrap
          tests.packaging.test_sdk_artifact_install
          tests.packaging.test_release_build

      - name: Build plugin and SDK artifacts
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            python scripts/build_release.py
          } else {
            python scripts/build_release.py --tag $env:RELEASE_TAG
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
