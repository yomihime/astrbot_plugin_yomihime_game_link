name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag to validate against metadata.yaml
        required: false
        type: string

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      YGL_TEST_ASTRBOT_SOURCE: ${{ github.workspace }}/.architecture-refactor/host-contract/astrbot
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Exclude independent Host test source from plugin checkout
        run: echo '/.architecture-refactor/host-contract/' >> .git/info/exclude

      - name: Check out pinned AstrBot contract source without running Host
        uses: actions/checkout@v6
        with:
          repository: AstrBotDevs/AstrBot
          ref: 3c7adafa1397e182d60b1016bf88759265113c8a
          path: .architecture-refactor/host-contract
          sparse-checkout: |
            astrbot/api
            astrbot/dashboard
            astrbot/core/config
          persist-credentials: false

      - name: Set up Python 3.13.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run FF14 page state and DOM tests
        run: node tests/pages/ff14/test_ui_a.mjs

      - name: Install build and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          setuptools==80.9.0 wheel==0.45.1 ruff==0.12.0

      - name: Install plugin runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install offline Host contract test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run FF14 item display contract and DOM tests
        run: node tests/pages/ff14/test_item_display.mjs

      - name: Build Linux SDK wheel for diagnostics
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: >-
          python -m pip wheel --no-index --no-deps --no-build-isolation
          --no-cache-dir --wheel-dir dist .

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Upload Linux SDK wheel diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build-diagnostics-${{ github.run_id }}
          path: dist/*.whl
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: verify
    runs-on: windows-latest
    env:
      YGL_TEST_ASTRBOT_SOURCE: ${{ github.workspace }}/.architecture-refactor/host-contract/astrbot
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Exclude independent Host test source from plugin checkout
        shell: pwsh
        run: Add-Content -LiteralPath .git/info/exclude -Value '/.architecture-refactor/host-contract/'

      - name: Check out pinned AstrBot contract source without running Host
        uses: actions/checkout@v6
        with:
          repository: AstrBotDevs/AstrBot
          ref: 3c7adafa1397e182d60b1016bf88759265113c8a
          path: .architecture-refactor/host-contract
          sparse-checkout: |
            astrbot/api
            astrbot/dashboard
            astrbot/core/config
          persist-credentials: false

      - name: Set up Python 3.13.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"

      - name: Install build and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          setuptools==80.9.0 wheel==0.45.1 ruff==0.12.0

      - name: Install plugin runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install offline Host contract test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run Windows host and packaging tests
        run: >-
          python -m unittest -v
          tests.host.test_b05_sdk_bootstrap
          tests.host.test_astrbot_contract
          tests.host.test_ff14_pages
          tests.host.test_astrbot_runtime
          tests.host.test_item_display_contract
          tests.packaging.test_sdk_artifact_install
          tests.packaging.test_release_build

      - name: Build plugin and SDK artifacts
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            python scripts/build_release.py
          } else {
            python scripts/build_release.py --tag $env:RELEASE_TAG
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
