name: Build release artifacts

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag to validate against metadata.yaml
        required: false
        type: string

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      YGL_TEST_ASTRBOT_SOURCE: ${{ github.workspace }}/.architecture-refactor/host-contract/astrbot
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Exclude independent Host test source from plugin checkout
        run: echo '/.architecture-refactor/host-contract/' >> .git/info/exclude

      - name: Check out pinned AstrBot contract source without running Host
        uses: actions/checkout@v6
        with:
          repository: AstrBotDevs/AstrBot
          ref: dffe922773725e9c178392c423676ad65044748c
          path: .architecture-refactor/host-contract
          sparse-checkout: |
            astrbot/api
            astrbot/dashboard
            astrbot/core
          persist-credentials: false

      - name: Set up Python 3.13.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked frontend dependencies
        run: npm ci --prefix pages/frontend

      - name: Check frontend types
        run: npm run typecheck --prefix pages/frontend

      - name: Build module and shell pages
        run: npm run build --prefix pages/frontend

      - name: Verify reproducible frontend projections
        run: python scripts/verify_frontend_build.py

      - name: Install build and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          setuptools==80.9.0 wheel==0.45.1 ruff==0.12.0

      - name: Install plugin runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install offline Host contract test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Prepare verified test font
        run: python scripts/prepare_test_font.py

      - name: Verify release link rejection before full regression
        run: >-
          python -m unittest -v
          tests.packaging.test_release_build.ReleaseBuildTests.test_ff14_bundle_rejects_external_links

      - name: Run shell, management and FF14 page tests
        run: |
          npm test --prefix pages/frontend
          node --test tests/pages/management/*.test.mjs tests/pages/management/test_management.mjs tests/pages/management/test_credentials.mjs tests/pages/ff14/*.test.mjs tests/pages/ff14/test_ui_a.mjs tests/pages/ff14/test_item_display.mjs tests/pages/ff14/test_market_projection.mjs tests/pages/ff14/test_market_ui.mjs tests/modules/minimal/*.test.mjs

      - name: Check documentation links
        run: python scripts/check_doc_links.py

      - name: Build Linux SDK wheel for diagnostics
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: >-
          python -m pip wheel --no-index --no-deps --no-build-isolation
          --no-cache-dir --wheel-dir dist .

      - name: Run unit tests
        env:
          YGL_TEST_SDK_WHEEL: ${{ github.workspace }}/dist/yomihime_game_link_sdk-0.1.0a10-py3-none-any.whl
        run: python -m unittest discover -s tests -t . -v

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Upload Linux SDK wheel diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build-diagnostics-${{ github.run_id }}
          path: dist/*.whl
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: verify
    # Hosted Windows Server images are outside the native NTFS qualification matrix.
    # Build the same platform-neutral ZIP through the reviewed POSIX path.
    runs-on: ubuntu-latest
    env:
      YGL_TEST_ASTRBOT_SOURCE: ${{ github.workspace }}/.architecture-refactor/host-contract/astrbot
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Exclude independent Host test source from plugin checkout
        run: echo '/.architecture-refactor/host-contract/' >> .git/info/exclude

      - name: Check out pinned AstrBot contract source without running Host
        uses: actions/checkout@v6
        with:
          repository: AstrBotDevs/AstrBot
          ref: dffe922773725e9c178392c423676ad65044748c
          path: .architecture-refactor/host-contract
          sparse-checkout: |
            astrbot/api
            astrbot/dashboard
            astrbot/core
          persist-credentials: false

      - name: Set up Python 3.13.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked frontend dependencies
        run: npm ci --prefix pages/frontend

      - name: Check frontend types
        run: npm run typecheck --prefix pages/frontend

      - name: Build module and shell pages
        run: npm run build --prefix pages/frontend

      - name: Install build and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          setuptools==80.9.0 wheel==0.45.1 ruff==0.12.0

      - name: Install plugin runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install offline Host contract test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Prepare verified test font
        run: python scripts/prepare_test_font.py

      - name: Run host and packaging tests on the supported build platform
        run: >-
          python -m unittest -v
          tests.host.test_b05_sdk_bootstrap
          tests.host.test_astrbot_contract
          tests.host.test_admin_pages
          tests.host.test_global_admin_commit_fence
          tests.host.test_ff14_pages
          tests.host.test_astrbot_runtime
          tests.host.test_item_display_contract
          tests.packaging.test_sdk_artifact_install
          tests.packaging.test_release_build
          tests.packaging.test_runtime_dependencies

      - name: Build plugin and SDK artifacts
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            python scripts/build_release.py
          else
            python scripts/build_release.py --tag "$RELEASE_TAG"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
